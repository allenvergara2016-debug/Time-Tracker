<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium minimal gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />

  <!-- Minimal Clock Dial (Subtle inset glow) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="16" />

  <!-- Active Time Segment Arc (90 deg to 360 deg) -->
  <path d="M 256 126 A 130 130 0 1 1 126 256" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Minimal Clock Hands (01:50 position) -->
  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="256" y2="175" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <!-- Minute Hand -->
  <line x1="256" y1="256" x2="330" y2="256" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Biometric Fingerprint / Pulse Waveform Arcs (Minimal) -->
  <path d="M 216 324 A 40 40 0 0 0 296 324" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 196 348 A 60 60 0 0 0 316 348" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />

  <!-- Geofence Pulse Dot -->
  <circle cx="348" cy="164" r="14" fill="#38bdf8" />
</svg>
