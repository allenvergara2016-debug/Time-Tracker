  <polyline points="256,210 256,242 278,256" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
  <!-- Biometric Fingerprint lines -->
  <path d="M216 330 C236 315 276 315 296 330" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" />
  <path d="M200 350 C230 330 282 330 312 350" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" />
</svg>

